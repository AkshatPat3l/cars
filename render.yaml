# Render Blueprint for CarCostCanada
# Deploy with: render.yaml import in Render Dashboard
# Or connect repo manually: https://github.com/AkshatPat3l/cars

services:
  - type: web
    name: carcostcanada
    env: docker
    plan: free
    dockerfilePath: apps/web/Dockerfile
    envVars:
      - key: NODE_VERSION
        value: 22
