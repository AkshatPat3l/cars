# Render Blueprint for CarCostCanada
# Deploy with: render.yaml import in Render Dashboard
# Or connect repo manually: https://github.com/AkshatPat3l/cars

services:
  - type: web
    name: carcostcanada
    env: static
    plan: free
    rootDirectory: apps/web
    buildCommand: npm install --ignore-scripts && npm run build
    publishDirectory: dist
    envVars:
      - key: NODE_VERSION
        value: 22
