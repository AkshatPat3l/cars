version: '3.8'

services:
  # Frontend web application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - carcostcanada

  # Development mode with hot reload (optional)
  web-dev:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    command: sh -c "cd apps/web && pnpm dev --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:4000
    profiles:
      - dev
    networks:
      - carcostcanada

networks:
  carcostcanada:
    driver: bridge
